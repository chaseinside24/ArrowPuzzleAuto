name: Android APK Build
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android project archive
        run: |
          test -f ArrowPuzzleAuto-phone-build.zip
          unzip -q ArrowPuzzleAuto-phone-build.zip
          cp tablet-patch/ArrowPuzzleAuto/app/src/main/java/com/example/arrowpuzzleauto/ArrowPuzzleGeometry.java ArrowPuzzleAuto/app/src/main/java/com/example/arrowpuzzleauto/ArrowPuzzleGeometry.java
          cp tablet-patch/ArrowPuzzleAuto/app/src/main/java/com/example/arrowpuzzleauto/BoardRecognizer.java ArrowPuzzleAuto/app/src/main/java/com/example/arrowpuzzleauto/BoardRecognizer.java
          python3 - <<'PY'
          from pathlib import Path
          p = Path("ArrowPuzzleAuto/app/src/main/java/com/example/arrowpuzzleauto/AutoSolverService.java")
          s = p.read_text()
          replacements = {
              "ArrowPuzzleGeometry.claimButtonCenter()":
                  "ArrowPuzzleGeometry.claimButtonCenter(frame.width, frame.height, board.geometryRotation)",
              "ArrowPuzzleGeometry.centers().get(index)":
                  "ArrowPuzzleGeometry.centers(frame.width, frame.height, board.geometryRotation).get(index)",
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f"Expected exactly one occurrence of {old!r}, found {s.count(old)}")
              s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Package patched Android source for inspection
        run: zip -qr ArrowPuzzleAuto-source-debug.zip ArrowPuzzleAuto/app/src/main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        working-directory: ArrowPuzzleAuto
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ArrowPuzzleAuto-Tab-S10-FE
          path: ArrowPuzzleAuto/app/build/outputs/apk/debug/*.apk
